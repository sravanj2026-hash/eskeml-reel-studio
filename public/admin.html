<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art of Eskeml Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* The owner's one screen: today, approvals, inbox, orders, catalogue, money, settings. Same maroon and gold as Reel Studio. */
:root{
  --bg:#170a10; --panel:#22111a; --panel2:#2d1622; --line:#4a2a37;
  --fg:#f4e9df; --muted:#b99f9a; --gold:#e3a923; --gold2:#f6d27a;
  --ok:#7fd49a; --warn:#f0a35e; --bad:#ef7d7d;
  --display:"Cinzel",Georgia,serif; --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--ui);font-size:14px;line-height:1.5;padding:0 16px 48px}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 12px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--display);color:var(--gold);font-size:20px;letter-spacing:.08em;margin:0}
header .grow{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:12px;scrollbar-width:none}
nav button{white-space:nowrap}
nav button.on{background:var(--gold);color:#2a0b16;border-color:var(--gold);font-weight:700}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
h2{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{background:var(--panel2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
button,.btn{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:8px 12px;font-weight:500;text-decoration:none;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--gold);border-color:var(--gold);color:#2a0b16;font-weight:700}
.danger{color:var(--bad)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
label.inline input{width:auto}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.form .full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.said{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.inbox{display:grid;gap:14px;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media (max-width:760px){.inbox{grid-template-columns:minmax(0,1fr)}}
.lead{cursor:pointer;text-align:left;width:100%}
.lead.on{border-color:var(--gold)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:8px 10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.in{background:var(--panel2);align-self:flex-start}
.msg.out{background:#3a2a12;align-self:flex-end}
.msg small{display:block;color:var(--muted);font-size:11px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px}
.col h3{font-size:12px;margin:0 0 8px;color:var(--gold2);letter-spacing:.04em}
.pieces{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.piece img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#000}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--gold)}
.bar.neg{background:var(--bad)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:9}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;max-width:min(560px,calc(100% - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.6)}
.up{color:var(--ok);font-size:11px}.down{color:var(--bad);font-size:11px}
.meter{height:8px;border-radius:4px;background:var(--panel);overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
.next{background:linear-gradient(135deg,#3a1a28,#22111a);border:1px solid var(--gold)}
.next b.big{font-family:var(--display);font-size:18px;color:var(--gold2)}
.plan td:first-child{white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--ui)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.login{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div id="loginView" class="login panel" hidden>
  <h2>Art of Eskeml</h2>
  <label>Dashboard passcode<input id="pass" type="password" autocomplete="current-password"></label>
  <button class="primary" id="loginBtn">Open dashboard</button>
  <p class="muted small" id="loginErr"></p>
</div>

<div id="app" hidden>
  <header>
    <h1 id="brand">Art of Eskeml</h1>
    <span class="grow"></span>
    <a class="btn" href="/">Reel Studio</a>
    <button id="logout">Lock</button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: k => { try { sessionStorage.removeItem(k); } catch {} } };
let PASS = store.get("aoe-pass") || "";
let TAB = "today";
const STAGE_LABEL = { design_approved: "Design approved", advance_paid: "Advance paid", in_making: "In making", qc: "Quality check", hallmarked: "Hallmarked", shipped: "Shipped", delivered: "Delivered" };
const rs = n => "₹" + Math.round(Number(n) || 0).toLocaleString("en-IN");
const when = d => d ? new Date(d).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";

// Builds DOM safely: customer text always goes in as text, never as HTML.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const field = (label, input, cls) => h("label", { class: cls }, label, input);
const inp = (name, value = "", type = "text", extra = {}) => h("input", { name, value: value ?? "", type, ...extra });

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }

async function api(action, body = {}) {
  const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-passcode": PASS }, body: JSON.stringify({ action, ...body }) });
  const data = await r.json().catch(() => ({ error: "The server sent an unexpected answer." }));
  if (r.status === 401) { showLogin("Wrong passcode."); throw new Error(data.error); }
  if (!r.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message); } finally { if (btn) btn.disabled = false; }
}
// A message that couldn't go out free through the API comes back as a link for the owner's phone.
function delivered(res) {
  if (!res) return;
  if (res.sent) return toast("Sent.");
  if (res.link) { openDialog("Send from your phone", h("p", {}, "This customer hasn't written in the last 24 hours, so free sending isn't allowed. Tap below to open the chat with the message ready, then press Send."), h("div", { class: "row" }, h("a", { class: "btn primary", href: res.link, target: "_blank", rel: "noopener" }, "Open chat"))); }
  else toast("Saved. Copy the message and send it yourself.");
}
function openDialog(title, ...body) {
  const d = $("dlg"); d.replaceChildren(h("h2", {}, title), ...body, h("div", { class: "row", style: "margin-top:12px;justify-content:flex-end" }, h("button", { onclick: () => d.close() }, "Close")));
  d.showModal();
}

function showLogin(msg = "") { $("app").hidden = true; $("loginView").hidden = false; $("loginErr").textContent = msg; PASS = ""; store.del("aoe-pass"); }
$("loginBtn").onclick = async () => {
  PASS = $("pass").value; store.set("aoe-pass", PASS);
  try { await api("summary"); start(); } catch (e) { $("loginErr").textContent = e.message; }
};
$("pass").addEventListener("keydown", e => e.key === "Enter" && $("loginBtn").click());
$("logout").onclick = () => showLogin();

const TABS = [["today", "Today"], ["approvals", "Approvals"], ["inbox", "Inbox"], ["orders", "Orders"], ["catalogue", "Catalogue"], ["money", "Money"], ["settings", "Settings"]];
let COUNTS = {};
function drawNav() {
  $("nav").replaceChildren(...TABS.map(([id, label]) => {
    const n = id === "approvals" ? COUNTS.pending_drafts : id === "today" ? COUNTS.to_send : 0;
    return h("button", { class: TAB === id ? "on" : "", onclick: () => go(id) }, label, n ? h("span", { class: "count" }, n) : null);
  }));
}
function go(id) { TAB = id; try { history.replaceState(null, "", "#" + id); } catch {} drawNav(); render(); }
async function start() {
  $("loginView").hidden = true; $("app").hidden = false;
  TAB = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "today";
  drawNav(); render();
}
async function render() {
  const v = $("view");
  v.replaceChildren(h("p", { class: "muted" }, "Loading…"));
  try { v.replaceChildren(...[].concat(await VIEWS[TAB]())); }
  catch (e) { v.replaceChildren(h("div", { class: "panel" }, h("p", {}, e.message))); }
}

const VIEWS = {
  // ---------- Today ----------
  async today() {
    const s = await api("summary"); COUNTS = s.counts; drawNav(); $("brand").textContent = s.business;
    const [rem, book, brief] = await Promise.all([api("reminders.list"), api("bookings.list"), api("brief")]);
    WORTH = brief.worth_limit;
    const rate = (m, p) => s.rates.find(r => r.metal === m && r.purity === p)?.rate_per_g ?? "";
    const rateRows = [["gold", "24K"], ["gold", "22K"], ["gold", "18K"], ["silver", "925"]];
    const rateForm = h("div", { class: "form" }, ...rateRows.map(([m, p]) => field(`${p} ${m} (₹/g)`, inp(`${m}|${p}`, rate(m, p), "number", { min: 0, step: "0.01", inputmode: "decimal" }))));
    const saveRates = h("button", { class: "primary", onclick: e => act(e.target, async () => {
      const rates = [...rateForm.querySelectorAll("input")].filter(i => i.value).map(i => { const [metal, purity] = i.name.split("|"); return { metal, purity, rate_per_g: Number(i.value) }; });
      await api("rates.set", { rates }); toast("Today's rates saved."); render();
    }) }, "Save today's rates");
    const missing = !s.rates.length;
    const c = s.counts, m = s.money;
    const conn = Object.entries({ WhatsApp: s.connected.whatsapp, Instagram: s.connected.instagram, "Photo uploads": s.connected.storage, "Claude (optional)": s.connected.claude })
      .map(([k, on]) => h("span", { class: "pill " + (on ? "ok" : "") }, `${k}: ${on ? "on" : "off"}`));
    return [
      h("div", { class: "panel" }, h("h2", {}, "Today, " + new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" })),
        h("div", { class: "kpis" },
          kpi(c.pending_drafts, "replies to approve"), kpi(c.new_leads, "new enquiries today"), kpi(c.calls_today, "calls / visits today"),
          kpi(c.open_orders, "orders in progress"), kpi(c.due_this_week, "orders due this week"), kpi(rs(m.customers_owe), "customers owe you")),
        h("div", { class: "row", style: "margin-top:10px" }, ...conn)),
      ...briefPanels(brief),
      h("div", { class: "grid" },
        h("div", { class: "panel" }, h("h2", {}, "Today's metal rate"),
          missing ? h("p", { class: "pill warn" }, "Not set yet. The assistant won't quote prices until you save it.") : null,
          rateForm, h("div", { class: "row", style: "margin-top:10px" }, saveRates)),
        h("div", { class: "panel" }, h("h2", {}, "To send from your phone"),
          rem.reminders.length ? h("div", { class: "list" }, ...rem.reminders.map(r => h("div", { class: "card" },
            h("div", { class: "top" }, h("b", {}, r.name || r.phone || "Customer"), h("span", { class: "pill" }, r.kind)),
            h("div", { class: "said" }, r.body),
            h("div", { class: "row" }, r.link ? h("a", { class: "btn primary", href: r.link, target: "_blank", rel: "noopener" }, "Open chat") : h("span", { class: "muted small" }, "No phone number"),
              h("button", { onclick: e => act(e.target, async () => { await api("reminder.done", { kind: r.kind, ref: r.ref }); render(); }) }, "Done"))))) :
            h("p", { class: "muted" }, "Nothing waiting. Review asks, thank-yous and payment reminders appear here when the customer hasn't messaged in 24 hours.")),
        h("div", { class: "panel" }, h("h2", {}, "Upcoming calls and visits"),
          book.bookings.length ? h("div", { class: "list" }, ...book.bookings.map(b => h("div", { class: "card" },
            h("div", { class: "top" }, h("b", {}, when(b.starts_at)), h("span", { class: "pill" }, b.kind.replace("_", " "))), h("div", {}, b.name || b.phone || ""),
            h("div", { class: "row" }, b.phone ? h("a", { class: "btn", href: `https://wa.me/${b.phone}`, target: "_blank", rel: "noopener" }, "WhatsApp") : null,
              h("button", { onclick: e => act(e.target, async () => { await api("booking.status", { id: b.id, status: "done" }); render(); }) }, "Done"),
              h("button", { class: "danger", onclick: e => act(e.target, async () => { await api("booking.status", { id: b.id, status: "cancelled" }); render(); }) }, "Cancel"))))) :
            h("p", { class: "muted" }, "No calls booked."))),
    ];
  },

  // ---------- Approvals ----------
  async approvals() {
    const { drafts } = await api("drafts.list");
    COUNTS.pending_drafts = drafts.length; drawNav();
    if (!drafts.length) return h("div", { class: "panel" }, h("h2", {}, "Approvals"), h("p", { class: "muted" }, "All caught up. New replies from the assistant appear here for you to check and send."));
    return h("div", { class: "panel" }, h("h2", {}, `Approvals (${drafts.length})`), h("div", { class: "list" }, ...drafts.map(d => {
      const ta = h("textarea", { value: d.body, rows: 6 });
      return h("div", { class: "card" },
        h("div", { class: "top" }, h("b", {}, d.name || d.phone || "Customer"), h("span", {}, h("span", { class: "pill" }, d.channel), " ", h("span", { class: "pill" }, d.kind), " ", h("span", { class: "pill" }, d.author === "claude" ? "Claude" : "Assistant"))),
        d.customer_said ? h("div", { class: "said" }, d.customer_said) : null,
        d.reason ? h("p", { class: "small" }, h("span", { class: "pill warn" }, d.reason)) : null,
        d.quote ? h("p", { class: "small muted" }, `Quote: ${d.quote.lines.map(l => `${l.sku} ${rs(l.total)}`).join(", ")} · total ${rs(d.quote.total)}`) : null,
        d.piece_skus.length ? h("p", { class: "small muted" }, "Photos attached: " + d.piece_skus.join(", ")) : null,
        ta,
        h("div", { class: "row", style: "margin-top:8px" },
          h("button", { class: "primary", onclick: e => act(e.target, async () => { const r = await api("draft.approve", { id: d.id, body: ta.value }); delivered(r.draft.delivery); render(); }) }, "Send"),
          h("button", { onclick: () => { TAB = "inbox"; INBOX.sel = d.lead_id; go("inbox"); } }, "Open chat"),
          h("button", { class: "danger", onclick: e => act(e.target, async () => { await api("draft.reject", { id: d.id }); render(); }) }, "Discard")));
    })));
  },

  // ---------- Inbox ----------
  async inbox() {
    const { leads } = await api("leads.list", { status: INBOX.filter });
    const filter = h("select", { onchange: e => { INBOX.filter = e.target.value; render(); } },
      ...[["open", "Open"], ["new", "New"], ["quoted", "Quoted"], ["booked", "Booked"], ["won", "Won"], ["lost", "Lost"], ["all", "All"]].map(([v, l]) => h("option", { value: v, selected: INBOX.filter === v }, l)));
    const list = h("div", { class: "list" }, ...leads.map(l => h("button", { class: "card lead" + (INBOX.sel === l.id ? " on" : ""), onclick: () => { INBOX.sel = l.id; render(); } },
      h("div", { class: "top" }, h("b", {}, l.name || l.phone || (l.instagram_handle ? "@" + l.instagram_handle : "Instagram customer")), h("span", { class: "pill" }, l.channel)),
      h("div", { class: "small muted", style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, l.last_body || ""),
      h("div", { class: "small" }, h("span", { class: "pill" }, l.status), l.pending ? h("span", { class: "pill warn", style: "margin-left:4px" }, "reply ready") : null,
        l.budget >= WORTH ? h("span", { class: "pill warn", style: "margin-left:4px" }, `worth your time · ${rs(l.budget)}`) : null))));
    const left = h("div", { class: "panel" }, h("div", { class: "row", style: "justify-content:space-between;margin-bottom:10px" }, h("h2", { style: "margin:0" }, "Inbox"), h("button", { onclick: addLead }, "+ Call or walk-in")), filter, h("div", { style: "margin-top:10px" }, leads.length ? list : h("p", { class: "muted" }, "No conversations here yet.")));
    return h("div", { class: "inbox" }, left, INBOX.sel ? await chatPanel(INBOX.sel) : h("div", { class: "panel muted" }, "Pick a conversation."));
  },

  // ---------- Orders ----------
  async orders() {
    const { orders, stages } = await api("orders.list", {});
    const board = h("div", { class: "board" }, ...stages.map(st => h("div", { class: "col" }, h("h3", {}, `${STAGE_LABEL[st]} (${orders.filter(o => o.stage === st).length})`),
      ...orders.filter(o => o.stage === st).map(o => h("button", { class: "card lead", style: "margin-bottom:8px", onclick: () => orderDialog(o.id) },
        h("b", {}, o.number), h("div", { class: "small" }, o.name || o.phone), h("div", { class: "small muted" }, o.items || ""),
        h("div", { class: "small" }, rs(o.total), o.paid < o.total ? h("span", { class: "pill warn", style: "margin-left:6px" }, `due ${rs(o.total - o.paid)}`) : h("span", { class: "pill ok", style: "margin-left:6px" }, "paid")),
        o.due_date ? h("div", { class: "small muted" }, "Due " + o.due_date) : null)))));
    return h("div", { class: "panel" }, h("div", { class: "row", style: "justify-content:space-between;margin-bottom:10px" }, h("h2", { style: "margin:0" }, "Orders"), h("button", { class: "primary", onclick: () => newOrder() }, "+ New order")), board);
  },

  // ---------- Catalogue ----------
  async catalogue() {
    const { pieces } = await api("pieces.list", { search: CAT.search });
    const search = inp("q", CAT.search, "search", { placeholder: "Search SKU, name, category" });
    search.addEventListener("change", e => { CAT.search = e.target.value; render(); });
    return h("div", { class: "panel" }, h("div", { class: "row", style: "justify-content:space-between;margin-bottom:10px" }, h("h2", { style: "margin:0" }, `Catalogue (${pieces.length})`), h("button", { class: "primary", onclick: () => pieceDialog({}) }, "+ Add piece")),

        $("dlg").close(); delivered(r.delivery); render(); }) }, `Mark ${STAGE_LABEL[next].toLowerCase()}`))) : h("p", { class: "pill ok" }, "Delivered"),
    h("div", { class: "card", style: "margin-top:10px" }, h("b", {}, "Record a payment"), h("div", { class: "form" }, field("Amount (₹)", amt), field("Method", method)),
      h("div", { class: "row", style: "margin-top:8px" }, h("button", { onclick: e => act(e.target, async () => { await api("order.payment", { id, amount: Number(amt.value), method: method.value }); toast("Payment saved."); $("dlg").close(); render(); }) }, "Save payment"))),
    h("div", { class: "row", style: "margin-top:10px" }, h("button", { onclick: e => act(e.target, async () => {
      const r = await api("order.invoice", { id }); const bin = atob(r.pdf_base64), u8 = Uint8Array.from(bin, ch => ch.charCodeAt(0));
      const a = h("a", { href: URL.createObjectURL(new Blob([u8], { type: "application/pdf" })), download: r.number.replace(/\//g, "-") + ".pdf" }); a.click(); }) }, invoice ? `Download invoice ${invoice.number}` : "Create GST invoice")),
    h("h2", { style: "margin-top:14px" }, "History"), h("div", { class: "small" }, ...events.map(ev => h("div", {}, `${when(ev.at)} · ${STAGE_LABEL[ev.stage] || ev.stage}${ev.note ? " · " + ev.note : ""}${ev.customer_notified === "link" ? " · (send from phone)" : ev.customer_notified === "sent" ? " · customer told" : ""}`)),
      ...payments.map(p => h("div", { class: "muted" }, `${when(p.at)} · received ${rs(p.amount)} by ${p.method}`))));
}

function pieceDialog(p) {
  const v = k => p[k] ?? "";
  const f = h("div", { class: "form" },
    field("SKU", inp("sku", v("sku"), "text", { readonly: p.sku ? true : null })), field("Name", inp("name", v("name"))), field("Category", inp("category", v("category"), "text", { placeholder: "earrings, necklace…" })),
    field("Metal", h("select", { name: "metal" }, ...["gold", "silver", "platinum"].map(m => h("option", { value: m, selected: (p.metal || "gold") === m }, m)))), field("Purity", inp("purity", p.purity || "22K")),
    field("Gross weight (g)", inp("gross_weight_g", v("gross_weight_g"), "number", { step: "0.001" })), field("Net weight (g)", inp("net_weight_g", v("net_weight_g"), "number", { step: "0.001" })),
    field("Making charge type", h("select", { name: "making_type" }, ...[["percent", "% of metal"], ["per_gram", "₹ per gram"], ["flat", "Flat ₹"]].map(([k, l]) => h("option", { value: k, selected: (p.making_type || "percent") === k }, l)))),
    field("Making charge", inp("making_value", v("making_value"), "number", { step: "0.01" })), field("Stones / other (₹)", inp("stone_cost", v("stone_cost"), "number")), field("Stock", inp("stock", p.stock ?? 1, "number")),
    field("Status", h("select", { name: "status" }, ...["active", "made_to_order", "sold", "hidden"].map(s => h("option", { value: s, selected: (p.status || "active") === s }, s.replace(/_/g, " "))))),
    field("Tagline", inp("tagline", v("tagline")), "full"), field("Caption", h("textarea", { name: "caption", value: v("caption") }), "full"), field("Hashtags", inp("hashtags", (p.hashtags || []).join(" ")), "full"));
  const file = h("input", { type: "file", accept: "image/*,video/mp4,video/webm", multiple: true });
  const media = h("div", { class: "row" }, ...(p.photos || []).map(u => h("img", { src: u, alt: "", style: "width:64px;height:64px;object-fit:cover;border-radius:6px" })), ...(p.reels || []).map((u, i) => h("a", { href: u, target: "_blank", rel: "noopener", class: "pill" }, `Reel ${i + 1}`)));
  openDialog(p.sku ? `Piece ${p.sku}` : "New piece", f, h("h2", { style: "margin-top:12px" }, "Photos and reels"), media, field("Add files (needs Supabase storage)", file),
    h("div", { class: "row", style: "margin-top:12px" }, h("button", { class: "primary", onclick: e => act(e.target, async () => {
      const piece = Object.fromEntries([...f.querySelectorAll("input,select,textarea")].map(i => [i.name, i.value]));
      const { piece: saved } = await api("pieces.save", { piece });
      for (const fl of file.files) await uploadMedia(saved.sku, fl);
      $("dlg").close(); toast("Piece saved."); render(); }) }, "Save piece")));
}

async function uploadMedia(sku, fileOrBlob, name = fileOrBlob.name || "reel.mp4") {
  const kind = (fileOrBlob.type || "").startsWith("video") ? "reel" : "photo";
  const { upload_url, public_url } = await api("pieces.upload_url", { sku, filename: name, kind });
  const r = await fetch(upload_url, { method: "PUT", headers: { "Content-Type": fileOrBlob.type || "application/octet-stream", "x-upsert": "true" }, body: fileOrBlob });
  if (!r.ok) throw new Error("Upload failed. Check the storage bucket exists and is public.");
  await api("pieces.add_media", { sku, kind, url: public_url });
}
